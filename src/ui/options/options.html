<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Orca Bookmarks 配置</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <h1>Orca Bookmarks 配置</h1>
  <form id="form">
    <label>
      MCP 端点
      <input id="endpoint" type="url" placeholder="http://localhost:18672/mcp" required />
    </label>
    <label>
      MCP Token
      <input id="token" type="password" placeholder="MCP Token" required />
    </label>
    <label>
      repoId
      <input id="repoId" type="text" placeholder="笔记库 id" required />
    </label>
    <div class="actions">
      <button type="submit">保存</button>
      <button type="button" id="test">测试连接</button>
    </div>
    <div id="msg"></div>
  </form>
  <script type="module" src="options.js"></script>
</body>
</html>
