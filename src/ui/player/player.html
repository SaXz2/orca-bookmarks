<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Orca 音乐播放器</title>
  <link rel="stylesheet" href="player.css" />
</head>
<body>
  <div class="player-container">
    <header class="player-header">
      <div class="player-header__icon">🎵</div>
      <div class="player-header__info">
        <h1 id="player-title" class="player-header__title">正在加载音乐…</h1>
        <div id="player-meta" class="player-header__meta">准备就绪</div>
      </div>
      <div class="player-header__tip">💡 本页面在后台常驻运行，即使关闭插件弹窗也能持续听歌</div>
    </header>

    <section class="player-controls">
      <button id="player-mode" class="player-btn" type="button">🔁 顺序播放</button>
      <button id="player-prev" class="player-btn" type="button">⏮ 上一首</button>
      <button id="player-play" class="player-btn player-btn--primary" type="button">▶ 播放</button>
      <button id="player-next" class="player-btn" type="button">⏭ 下一首</button>
      <div class="player-status-badge" id="player-status">播放中</div>
    </section>

    <!-- 播放器视口：保证真实渲染有声播放（支持 B站/网易云/YouTube 原生播放） -->
    <section class="player-viewport">
      <div id="player-frame-wrap" class="player-frame-wrap"></div>
    </section>

    <section class="player-playlist-section">
      <h2 class="player-playlist__heading">歌单清单 (<span id="playlist-count">0</span>)</h2>
      <div id="playlist" class="player-playlist"></div>
    </section>
  </div>
  <script type="module" src="player.js"></script>
</body>
</html>
