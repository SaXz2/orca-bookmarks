<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Orca Bookmarks</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header class="popup-header">
    <input id="search" class="popup-header__search" type="search" placeholder="搜索标题 / URL / 标签…" autofocus aria-label="搜索标题 / URL / 标签" />
    <a id="open-options" class="popup-header__options-link" href="#" title="打开配置页" aria-label="打开配置页">⚙</a>
  </header>
  <nav id="folder-tabs" class="popup-tabs" role="tablist" aria-label="文件夹"></nav>
  <div id="status" class="popup-status" role="status" aria-live="polite"></div>
  <main id="list" class="popup-list"></main>
  <script type="module" src="popup.js"></script>
</body>
</html>
